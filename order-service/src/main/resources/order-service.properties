spring.application.name=order-service

# 9장: 주문 서비스는 결제 이벤트만 받는다(웹 API 없음)
spring.main.web-application-type=none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:order-schema.sql

# 자기 DB. 결제 서버와 같은 MySQL 의 다른 스키마(order_service)를 다른 계정으로 쓴다
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=order_service
spring.datasource.password=order_service

# 결제 이벤트
spring.kafka.bootstrap-servers=localhost:9092
order.payment-events.topic=payment-events
spring.kafka.consumer.group-id=order-service
# 처음 뜬 주문 서비스는 토픽의 처음부터 읽는다
spring.kafka.consumer.auto-offset-reset=earliest
# 결제 이벤트 토픽의 파티션 수(2)만큼 따로 읽는다
spring.kafka.listener.concurrency=2

# 11장 결정 3: 일시 오류(DB 가 쓰기를 거부함 등)는 같은 자리에서 1·2·4·8초 뒤에 다시 시도한다(4번, 기다림 합 15초).
# 근거: 이 머신에서 MySQL 8.4 컨테이너를 다시 띄워 쿼리를 받기까지 2.6~3.0초(5번, docs/ch11/04) — 15초는 그 5배다(5배 여유는 가정).
# 한 번 기다리는 가장 긴 시간(8초)은 소비자가 그룹에서 빠지는 max.poll.interval.ms(기본 5분)보다 훨씬 짧다.
# 비용: 다시 시도를 다 쓸 때까지 같은 파티션의 뒤 이벤트가 기다린다(docs/ch11/04 의 막는 시간)
order.retry.initial-interval=1s
order.retry.multiplier=2
order.retry.max-interval=8s
order.retry.max-retries=4

# 11장 결정 4: 다시 시도를 다 쓴 결제 이벤트와 영구 오류 이벤트를 모으는 실패 모음(<결제 이벤트 토픽>.DLT). 원래 파티션과 같은 번호에 실어 파티션 수가 같아야 한다
order.dead-letter.topic=${order.payment-events.topic}.DLT
order.dead-letter.partitions=2
order.dead-letter.source-topic=${order.payment-events.topic}
# 운영자 다시 넣기 명령(order.dead-letter.replay=true 로 한 번 띄움)이 어디까지 다시 넣었는지 기억하는 소비자 그룹
order.dead-letter.replay-group=${spring.kafka.consumer.group-id}-dlt-replay

# 12장 결정 5: 받은 결제 이벤트 기록의 정리. 매일 cron 때에 retention 보다 오래전에 받은 기록을 batch-size 줄씩 지운다.
# retention 14일의 근거: 같은 이벤트가 다시 올 수 있는 동안(토픽·실패 모음에 남아 있는 동안)은 남겨 결정 1로 가린다. 두 토픽은 브로커 기본 보존 기간(log.retention.hours
# 기본 168시간 = 7일)을 쓴다 — 14일은 그 두 배다(두 배는 가정). 그보다 늦게 다시 와도 주문은 11장 결정 2(마지막으로 반영한 번호)가 바꾸지 않는다
order.cleanup.retention=14d
order.cleanup.batch-size=1000
order.cleanup.cron=0 30 4 * * *
