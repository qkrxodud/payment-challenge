plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.awaitility:awaitility'
	// 2장부터: 테스트 안에서 Mock PG 를 임의 포트로 띄운다
	testImplementation project(':mock-pg')
	// 1장 비교 구현용. 2026-07 저장소 보관(archived), 더 이상 유지보수되지 않는다
	testImplementation 'org.springframework.statemachine:spring-statemachine-core:4.0.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('test') {
	useJUnitPlatform {
		// 계약을 지키지 못하는 비교 구현은 기본 빌드에서 빼고 knownFailingTest 로 따로 돌린다.
		// 4장 측정은 reconciliationMeasurement 로 따로 돌린다
		excludeTags 'known-failing', 'measurement'
	}
	// 4장부터: 테스트는 보정을 직접 부른다. 주기 보정이 테스트 도중 끼어들지 않게 끈다
	systemProperty 'payment.reconciliation.enabled', 'false'
	finalizedBy jacocoTestReport
}

tasks.register('knownFailingTest', Test) {
	description = '계약 테스트를 지키지 못하는 비교 구현을 같은 테스트로 돌려 실패를 기록한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'known-failing'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	ignoreFailures = true
}

tasks.register('reconciliationMeasurement', Test) {
	description = '4장: 구현마다 같은 결제 묶음을 보정해 카드사 승인·취소 건수와 결제 최종 상태, 보정 횟수와 시간을 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch04-reconciliation.txt')
	}
}

def jacocoExcludes = ['com/example/payment/PaymentChallengeApplication*']

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				minimum = 0.90
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}
