plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// 7장 결정 1 비교(실제 JPA @Version): 운영 Payment.java 를 그대로 복사하면서 변경 번호 칸(@Version) 하나만 더한 시험용 결제를 만든다.
// 운영 코드는 바꾸지 않는다. 이 결제는 jpaVersionTest·jpaVersionMeasurement 의 클래스 경로 맨 앞에만 올라가 운영 Payment 를 가린다
def versionedPaymentSource = layout.buildDirectory.dir('generated/versioned-payment/java')

tasks.register('generateVersionedPayment', Copy) {
	from('src/main/java') {
		include 'com/example/payment/domain/payment/Payment.java'
	}
	into versionedPaymentSource
	filter { String line ->
		if (line.trim() == 'private Instant authenticatedAt;') {
			return line + '\n\n    // 7장 비교: 시험에서만 더한 변경 번호(JPA @Version)\n    @jakarta.persistence.Version\n    @Column(name = "version")\n    private Long version;'
		}
		return line
	}
}

sourceSets {
	versionedPayment {
		java.srcDir versionedPaymentSource
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
}

configurations {
	versionedPaymentCompileOnly.extendsFrom compileOnly
	versionedPaymentAnnotationProcessor.extendsFrom annotationProcessor
}

tasks.named('compileVersionedPaymentJava') {
	dependsOn 'generateVersionedPayment'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 9장부터: 결제 이벤트를 Kafka 로 보낸다
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.awaitility:awaitility'
	// 2장부터: 테스트 안에서 Mock PG 를 임의 포트로 띄운다
	testImplementation project(':mock-pg')
	// 9장부터: 테스트 안에서 주문 서비스(결제 이벤트를 받는 쪽)를 띄운다
	testImplementation project(':order-service')
	// 10장부터: 테스트 안에서 재고 서비스를 띄운다
	testImplementation project(':inventory-service')
	// 1장 비교 구현용. 2026-07 저장소 보관(archived), 더 이상 유지보수되지 않는다
	testImplementation 'org.springframework.statemachine:spring-statemachine-core:4.0.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('test') {
	useJUnitPlatform {
		// 계약을 지키지 못하는 비교 구현은 기본 빌드에서 빼고 knownFailingTest 로 따로 돌린다.
		// 4장 측정은 reconciliationMeasurement, 5장 측정은 cancelMeasurement, 6장 측정은 webhookMeasurement,
		// 7장 측정은 concurrencyMeasurement, 8장 측정은 stockMeasurement, 9장 측정은 outboxMeasurement, 10장 측정은 sagaMeasurement 로 따로 돌린다
		excludeTags 'known-failing', 'measurement', 'cancel-measurement', 'webhook-measurement', 'concurrency-measurement',
				'jpa-version', 'jpa-version-measurement', 'stock-measurement', 'outbox-measurement'
	}
	// 4장부터: 테스트는 보정을 직접 부른다. 주기 보정이 테스트 도중 끼어들지 않게 끈다
	systemProperty 'payment.reconciliation.enabled', 'false'
	// 6장부터: 받은 웹훅 처리도 테스트가 직접 부른다
	systemProperty 'payment.webhook.enabled', 'false'
	// 9장부터: 남긴 결제 결과를 보내는 릴레이도 끈다. 결제 이벤트 계약 테스트만 켜서 돌린다
	systemProperty 'payment.outbox.enabled', 'false'
	finalizedBy jacocoTestReport
}

tasks.register('knownFailingTest', Test) {
	description = '계약 테스트를 지키지 못하는 비교 구현을 같은 테스트로 돌려 실패를 기록한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'known-failing'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	ignoreFailures = true
	// 7장: 실제 JPA @Version 비교는 시험용 결제를 앞세운 클래스 경로가 필요해 따로 돈다. knownFailingTest 를 부르면 함께 돈다
	finalizedBy 'jpaVersionTest'
}

tasks.register('jpaVersionTest', Test) {
	description = '7장: 결제에 JPA @Version 을 둔 비교 구현(시험용 결제)을 같은 결제 기록 계약으로 돌려 실패를 기록한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.versionedPayment.output + sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'jpa-version'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	ignoreFailures = true
}

tasks.register('reconciliationMeasurement', Test) {
	description = '4장: 구현마다 같은 결제 묶음을 보정해 카드사 승인·취소 건수와 결제 최종 상태, 보정 횟수와 시간을 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch04-reconciliation.txt')
	}
}

tasks.register('cancelMeasurement', Test) {
	description = '5장: 구현마다 같은 취소 묶음을 보내고 보정한 뒤 카드사 취소 건수와 잔액을 우리 기록과 비교해 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'cancel-measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch05-cancel.txt')
	}
}

tasks.register('webhookMeasurement', Test) {
	description = '6장: 구현마다 같은 알림 묶음을 보내고 카드사와 어긋난 결제 수, 재전송 횟수, 맞춰지기까지 시간을 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'webhook-measurement'
	}
	// 측정은 받은 알림 처리와 주기 보정을 직접 돌린다(0.2초마다)
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch06-webhook.txt')
	}
}

tasks.register('concurrencyMeasurement', Test) {
	description = '7장: 같은 결제에 동시 요청 N개를 보내 잠금 방식마다 응답 시간과 답을 세고, 서버 수마다 보정 주기의 카드사 조회 횟수를 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'concurrency-measurement'
		excludeTags 'jpa-version-measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch07-concurrency.txt')
	}
	finalizedBy 'jpaVersionMeasurement'
}

tasks.register('jpaVersionMeasurement', Test) {
	description = '7장: concurrencyMeasurement 의 잠금 방식 측정을 JPA @Version 비교(시험용 결제)로도 돌려 같은 파일에 덧붙인다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.versionedPayment.output + sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'jpa-version-measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
}

tasks.register('stockMeasurement', Test) {
	description = '8장: 재고 100개 상품에 승인 요청 300건을 한꺼번에 보내 재고를 줄이는 방식마다 과판매 수·승인 수·응답 시간·처리량을 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'stock-measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch08-stock.txt')
	}
}

tasks.register('outboxMeasurement', Test) {
	description = '9장: 결제 결과를 보내는 방식마다 브로커를 4초 끊은 동안의 유실·중복·순서 위반·도착 지연을 세고, 릴레이를 나누는 방식마다 서버 두 대의 처리량을 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'outbox-measurement'
	}
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	systemProperty 'payment.outbox.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch09-outbox.txt')
	}
}

tasks.register('sagaMeasurement', Test) {
	description = '10장: 재고 서비스를 늦추고 끊은 동안 방식마다 결제 응답 시간·넘겨 판 수량·돌아오지 않은 재고·원복 시간을 세고, 재고 예약 응답 시간을 남긴다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'saga-measurement'
	}
	// 측정은 릴레이를 운영처럼 0.5초마다 돌린다(시험 설정에서 켠다). 보정·알림 처리는 끈다
	systemProperty 'payment.reconciliation.enabled', 'false'
	systemProperty 'payment.webhook.enabled', 'false'
	outputs.upToDateWhen { false }
	doFirst {
		delete layout.buildDirectory.file('measurement/ch10-saga.txt')
	}
}

// 8장: 시험 컨텍스트마다 MySQL 컨테이너가 하나씩 뜬다. Spring 기본 캐시(32개)는 컨텍스트를 닫지 않고 두어, 8장 비교 구현으로 컨텍스트가 늘자
// 컨테이너가 한꺼번에 많이 떠 있다가 새 컨테이너에 접속하지 못했다. 캐시를 10개로 묶어 오래 안 쓴 컨텍스트(와 그 컨테이너)를 닫는다
tasks.withType(Test).configureEach {
	systemProperty 'spring.test.context.cache.maxSize', '10'
}

def jacocoExcludes = ['com/example/payment/PaymentChallengeApplication*']

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				minimum = 0.90
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}
