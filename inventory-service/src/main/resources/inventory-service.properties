spring.application.name=inventory-service

# 10장: 결제 서버에서 떼어 낸 재고 서비스. 결제 서버가 HTTP 로 재고를 예약하고(결정 1·3), 확정·해제는 Kafka 로 보낸다(결정 5)
server.port=8091
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:inventory-schema.sql

# 자기 DB. 결제 서버와 같은 MySQL 의 다른 스키마(inventory_service)를 다른 계정으로 쓴다
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_service
spring.datasource.username=inventory_service
spring.datasource.password=inventory_service

# 10장 결정 5: 결제 서버가 보낸 예약 확정·해제(재고 명령). 키는 결제 번호(= 예약 번호)라 같은 예약의 명령은 한 파티션에서 보낸 순서대로 읽는다
spring.kafka.bootstrap-servers=localhost:9092
inventory.stock-commands.topic=stock-reservation-commands
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=2

# 11장 결정 3: 일시 오류는 같은 자리에서 1·2·4·8초 뒤에 다시 시도한다(4번, 기다림 합 15초). 근거는 주문 서비스와 같다(order-service.properties)
inventory.retry.initial-interval=1s
inventory.retry.multiplier=2
inventory.retry.max-interval=8s
inventory.retry.max-retries=4

# 11장 결정 4: 다시 시도를 다 쓴 재고 명령과 영구 오류 명령을 모으는 실패 모음(<재고 명령 토픽>.DLT). 원래 파티션과 같은 번호에 실어 파티션 수가 같아야 한다
inventory.dead-letter.topic=${inventory.stock-commands.topic}.DLT
inventory.dead-letter.partitions=2
inventory.dead-letter.source-topic=${inventory.stock-commands.topic}
# 운영자 다시 넣기 명령(inventory.dead-letter.replay=true 로 한 번 띄움)이 어디까지 다시 넣었는지 기억하는 소비자 그룹
inventory.dead-letter.replay-group=${spring.kafka.consumer.group-id}-dlt-replay

# 12장 결정 5: 처리한 재고 명령 기록의 정리. 근거는 주문 서비스와 같다(order-service.properties) — 브로커 기본 보존 기간 7일의 두 배(두 배는 가정).
# 그보다 늦게 같은 명령이 와도 예약은 11장 결정 2(마지막으로 반영한 번호)와 10장 예약 상태 전이가 바꾸지 않는다
inventory.cleanup.retention=14d
inventory.cleanup.batch-size=1000
inventory.cleanup.cron=0 30 4 * * *
# 12장 결정 5: 운영 지표를 HTTP 로 내보낸다(기본은 health 만)
management.endpoints.web.exposure.include=health,metrics
