spring.application.name=payment-challenge

# 스키마는 schema.sql로 직접 관리한다. Hibernate가 만들면 상태 컬럼이 MySQL enum 타입이 된다(1장 참고).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# 웹 요청이 끝날 때까지 영속성 컨텍스트와 DB 연결을 붙잡지 않는다.
# 켜 두면 트랜잭션을 나눠도 PG 답을 기다리는 동안 연결을 놓지 않는다.
spring.jpa.open-in-view=false

# PG(2장부터 Mock PG). 따로 띄운 Mock PG 의 기본 포트
payment.pg.base-url=http://localhost:8090
# 시간 제한은 Mock PG 기준으로 정한 값이다. 실제 값은 PG 가 안내하는 승인 처리 시간과
# 이 서버가 고객에게 약속한 응답 시간을 보고 정한다.
payment.pg.connect-timeout=1s
payment.pg.read-timeout=5s

# 결과 모름 보정(4장). 승인을 요청한 지 wait-after-request 가 지난 결과 모름 결제를 interval 마다 카드사에 조회해 맞춘다.
# wait-after-request 는 PG 연결·읽기 시간 제한(1s + 5s)보다 길게, 카드사가 늦게라도 처리를 마쳤을 만큼으로 둔다.
payment.reconciliation.wait-after-request=1m
payment.reconciliation.interval=1m
