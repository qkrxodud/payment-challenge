spring.application.name=payment-challenge

# 스키마는 schema.sql로 직접 관리한다. Hibernate가 만들면 상태 컬럼이 MySQL enum 타입이 된다(1장 참고).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# 웹 요청이 끝날 때까지 영속성 컨텍스트와 DB 연결을 붙잡지 않는다.
# 켜 두면 트랜잭션을 나눠도 PG 답을 기다리는 동안 연결을 놓지 않는다.
spring.jpa.open-in-view=false

# PG(2장부터 Mock PG). 따로 띄운 Mock PG 의 기본 포트
payment.pg.base-url=http://localhost:8090
# 시간 제한은 Mock PG 기준으로 정한 값이다. 실제 값은 PG 가 안내하는 승인 처리 시간과
# 이 서버가 고객에게 약속한 응답 시간을 보고 정한다.
payment.pg.connect-timeout=1s
payment.pg.read-timeout=5s
# 12장 결정 1: 거래 조회(대사). 토스페이먼츠 문서는 이 요청이 60초까지 걸릴 수 있어 60초 이상으로 두라고 한다
payment.pg.transactions-read-timeout=60s

# 결과 모름 보정(4장). 승인을 요청한 지 wait-after-request 가 지난 결과 모름 결제를 interval 마다 카드사에 조회해 맞춘다.
# wait-after-request 는 PG 연결·읽기 시간 제한(1s + 5s)보다 길게, 카드사가 늦게라도 처리를 마쳤을 만큼으로 둔다.
payment.reconciliation.wait-after-request=1m
payment.reconciliation.interval=1m

# 웹훅 처리(6장). 받은 알림은 바로 남기고 200 으로 답한 뒤, interval 마다 처리기가 카드사 조회로 결제를 맞춘다.
# 토스페이먼츠는 10초 안에 200 을 받아야 성공으로 본다. 카드사 조회(읽기 제한 5초)를 요청 안에서 하면 그 안에 못 답할 수 있어 나눴다
payment.webhook.interval=1s

# 주기 작업 잠금(7장). 서버 여러 대 가운데 한 대만 보정·알림 처리를 돈다. 맡은 서버는 lease 동안 맡는다.
# 보정 한 주기는 결제 100건 × (PG 연결 1s + 읽기 5s)까지 걸릴 수 있어 그보다 길게 둔다. 맡은 서버가 죽으면 이만큼 멈춘다
payment.job-lock.lease=15m

# 결제 이벤트(9장). 결제 결과(승인·승인 실패·취소 등)를 Kafka 토픽으로 주문 서비스에 알린다
spring.kafka.bootstrap-servers=localhost:9092
payment.events.topic=payment-events
# 받는 쪽은 파티션마다 따로 읽는다. 토픽이 없으면 서버가 뜰 때 이 수로 만든다
payment.events.partitions=2
# 남긴 결제 결과를 보내는 릴레이(9장 결정 2). interval 마다 아직 보내지 않은 결과를 번호 순으로 batch-size 건까지 읽어 보낸다
payment.outbox.interval=500ms
payment.outbox.batch-size=50
# 결제 이벤트 프로듀서(9장 결정 4). 모든 복제본이 받았다고 답해야 보낸 것으로 보고(acks=all), 다시 보내도 두 번 쓰이거나 순서가 바뀌지 않게 한다.
# Kafka 3.0 부터 둘 다 기본값이지만 이 장의 결정이라 적어 둔다
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# 릴레이 한 주기(batch-size 50건)는 한 건마다 받았다는 답을 기다린다. 기본 2분(delivery.timeout.ms)이면 브로커가 끊겼을 때 한 주기가
# 50 × 2분이 되어 작업 잠금 lease(15분)를 넘고, 다른 서버도 릴레이를 맡게 된다. 한 건을 10초(요청 하나 5초)까지만 기다린다 — 한 주기 최대 약 8분
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000

# 재고 서비스(10장). 8장에 결제 서버 안에 있던 재고를 떼어 냈다.
# 10장 결정 1: 카드사에 승인을 요청하기 전에 재고 서비스에 동기 HTTP 로 재고를 잡는다. 재고 서비스의 답을 기다리는 동안이 그대로 결제 응답에
# 더해지므로 시간 제한을 짧게 둔다. 재고 잡기는 재고 서비스 DB 의 짧은 트랜잭션 하나다(측정은 docs/ch10/04).
# 읽기 1s: 예약 300건 동시 최대 746ms. 연결 300ms: 새 연결 1000개 동시 최대 128ms(같은 머신 — 망을 건너는 시간은 재지 않음)
payment.inventory.base-url=http://localhost:8091
payment.inventory.connect-timeout=300ms
payment.inventory.read-timeout=1s
# 10장 결정 5: 예약 확정·해제는 payment_outbox 에 남기고 9장 릴레이가 이 토픽으로 보낸다(키 = 결제 번호). 토픽이 없으면 서버가 뜰 때 만든다
payment.inventory.commands-topic=stock-reservation-commands

# 하루치 대사(12장 결정 1). 매일 cron 때(zone 기준)에 어제 하루의 카드사 거래 내역과 우리 결제를 결제 키로 맞춰 본다.
# zone: 하루를 가르는 시간대. 카드사 거래 조회 날짜에 시간대가 없어 가맹점(한국) 시각으로 본다(가정)
# cron: 새벽 4시. 카드사가 어제 거래를 언제까지 모두 내놓는지는 확인하지 못했다(가정) — 늦게 들어온 거래는 그날을 다시 대사해 찾는다
# page-size: 거래 조회 한 번에 받는 거래 수(토스페이먼츠 최대 5000)
payment.daily-reconciliation.zone=Asia/Seoul
payment.daily-reconciliation.cron=0 0 4 * * *
payment.daily-reconciliation.page-size=5000
